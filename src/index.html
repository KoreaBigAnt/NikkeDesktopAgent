<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' data:; img-src 'self' data: blob:">
  <title>NIKKE Desktop Agent</title>
  <link rel="stylesheet" href="/spine.css">
  <link rel="stylesheet" href="/pet.css">
</head>
<body>
  <main class="pet">
    <section class="stage" aria-label="니케 캐릭터">
      <div id="body-model" class="model"></div>
      <div id="cover-model" class="model standby"></div>
      <div id="aim-model" class="model standby"></div>
      <button id="pet-hit" class="pet-hit" type="button" aria-label="캐릭터 터치 모션" disabled></button>
      <div id="asset-status" class="asset-status" role="status">
        <span id="asset-message">캐릭터 불러오는 중</span>
        <button id="retry" type="button" hidden>다시 불러오기</button>
      </div>
    </section>
    <aside id="reply" class="reply" aria-label="펫 대화" hidden>
      <button id="hide-reply" type="button" aria-label="대화 접기" title="대화 접기">×</button>
      <div id="messages" class="messages" tabindex="0" aria-live="polite"></div>
    </aside>
    <section class="dock" aria-label="펫 메시지 입력">
      <form id="prompt-form">
        <span class="grip" title="드래그하여 이동">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4h.01M10 4h.01M6 8h.01M10 8h.01M6 12h.01M10 12h.01"/></svg>
        </span>
        <textarea id="prompt" aria-label="메시지 입력" placeholder="Gemini로 대화하기" rows="1" maxlength="32000"></textarea>
        <button id="send" class="send" type="submit" title="전송" aria-label="전송" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
        </button>
        <button id="stop" class="send" type="button" title="작업 중지" aria-label="작업 중지" hidden>■</button>
      </form>
    </section>
    <section id="settings" class="settings" aria-label="펫 설정" hidden>
      <div id="settings-menu" class="settings-menu">
        <select id="character" class="settings-wide" aria-label="캐릭터"></select>
        <select id="character-sort" aria-label="캐릭터 정렬">
          <option value="release">출시순</option>
          <option value="id" selected>ID순</option>
          <option value="name">이름순</option>
        </select>
        <select id="chat-backend" aria-label="대화 방식">
          <option value="gemini">Gemini 대화</option>
          <option value="codex">Codex 작업</option>
        </select>
        <button id="open-key" type="button">Gemini 키</button>
        <button id="open-persona" type="button">페르소나 설정</button>
        <select id="theme" aria-label="채팅 테마">
          <option value="black">테마 · 블랙</option>
          <option value="white">테마 · 화이트</option>
        </select>
        <button id="show-reply" type="button">대화 보기</button>
        <button id="pin" type="button" aria-pressed="true">항상 위에</button>
        <button id="minimize" type="button">최소화</button>
        <button id="close" class="settings-wide" type="button">펫 닫기</button>
      </div>
      <form id="gemini-settings" hidden>
        <button id="back-settings" type="button">‹ 설정</button>
        <label for="gemini-key">Gemini API 키</label>
        <input id="gemini-key" type="password" autocomplete="off" spellcheck="false" maxlength="512" required>
        <button id="save-key" type="submit">키 저장</button>
        <span id="key-status" role="status"></span>
      </form>
    </section>
    <span id="status" class="sr-only" role="status">대화 설정 확인 중</span>
  </main>
  <script type="module" src="/pet.mjs"></script>
</body>
</html>
